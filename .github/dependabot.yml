version: 2

# Before this file existed the repo had no Dependabot config at all: only
# security updates were running (enabled at repo level), ungrouped. That
# produced 21 single-package PRs against two lockfiles, each of which
# invalidates the others on merge, while several open alerts got no PR at all
# because the ungrouped security-update PR limit was saturated.
#
# Grouping collapses those into a handful of PRs per directory and lets the
# whole dependency tree move in one reviewable step.

updates:
  - package-ecosystem: npm
    directory: /http-request-action
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
      development:
        applies-to: version-updates
        dependency-type: development
      security-production:
        applies-to: security-updates
        dependency-type: production
      security-development:
        applies-to: security-updates
        dependency-type: development

  - package-ecosystem: npm
    directory: /pipeline-protection
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
      development:
        applies-to: version-updates
        dependency-type: development
      security-production:
        applies-to: security-updates
        dependency-type: production
      security-development:
        applies-to: security-updates
        dependency-type: development

  # No github-actions ecosystem entry: this repo has no workflows of its own.
  # GitHub Actions is disabled here and CI is moving to Jenkins.
